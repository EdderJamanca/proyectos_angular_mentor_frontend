name: Deploy Angular

on:
  push:
    branches:
      - buscadorRecetas

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Build Angular producción
        run: npm run build -- --configuration production

      - name: Verificar build generado
        run: |
          dir dist

      - name: Deploy a IIS (local)
        run: |
          robocopy dist\mi-app C:\Frontend /MIR
