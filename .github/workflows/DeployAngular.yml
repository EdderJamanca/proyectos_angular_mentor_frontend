name: Deploy Angular

on: 
  push: 
    branches: 
      - buscadorRecetas
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código 
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '22.20.0'
      - name: Instalar dependencias
        run:
          npm install || true

      - name: Mostrar logs de npm-debug
        if: failure()
        run:
          type npm-debug.log
          
      - name: Debug secrets
        run: |
          if [ -z "${{ secrets.SERVER_PASS }}" ]; then
            echo "❌ SERVER_PASS está vacío"
            exit 1
          else
            echo "✅ SERVER_PASS detectado"
          fi
          
      - name: Ver build generado
        run: |
          ls -R proyectos_angular_mentor_frontend/dist

      - name: Deploy a IIS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: administrator
          password: ${{ secrets.SERVER_PASS }}
          port: 22
          source: "proyectos_angular_mentor_frontend/dist/mi-app/*"
          target: ${{ secrets.SERVER_PATH_FRONTEND }}
           

        
